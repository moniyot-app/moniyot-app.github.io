<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-title" content="רמוניות">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f2a44">
</head>
<body>
<title>רמוניות · אימון</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Rubik:wght@500;700&display=swap">
<style>
/* Layout: a working console. Sticky top bar with page switch; content column up to 1100px; panels by role. */
:root{
  --page:#ffffff; --bg:#f6f7f9; --surface:#ffffff; --ink:#2a2f36; --muted:#6c7580; --line:#e5e8ec;
  --accent:#f3d27a; --accent-ink:#3b3220; --accent-soft:#fdf8e7;
  --ok:#3a8f68; --ok-soft:#eef8f2; --warn:#a8741f; --warn-soft:#fdf6e8; --bad:#c2554c; --bad-soft:#fcefed;
  --chip:#eaf0f7; --chip-ink:#35506e; --s1:#2a78d6; --s2:#eb6834; --boss:#f1ecfd; --boss-line:#cbbcf5; --boss-ink:#5a3fa8; --air:#e7f1fc; --air-line:#86b6ea; --air-ink:#2b5f97; --taxi:#fff4c9; --taxi-line:#e8b923; --taxi-ink:#7a5a00; --biz:#1d5fd1; --biz-soft:#e4eefd; --prem:#a3570a; --prem-soft:#fdeedb; --tour:#0d7a52; --tour-soft:#ddf3e9; --ceo:#ffe1b0; --ceo-line:#e8890c; --ceo-ink:#7a3d00;
  --font-display:"Rubik","Assistant",system-ui,sans-serif;
  --font-body:"Assistant",system-ui,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#111418; --chip:#22303f; --chip-ink:#c9d8ea; --s1:#3987e5; --s2:#d95926; --boss:#2a2340; --boss-line:#5b4a8f; --boss-ink:#cdbcff; --air:#182a3e; --air-line:#3f74ad; --air-ink:#9cc8f5; --taxi:#3a3010; --taxi-line:#c99a12; --taxi-ink:#f5d36a; --biz:#7fb0ff; --biz-soft:#16284a; --prem:#f2b066; --prem-soft:#3a2610; --tour:#5fd3a2; --tour-soft:#10342a; --ceo:#4a2c08; --ceo-line:#e8890c; --ceo-ink:#ffc874;
  --bg:#171b20; --surface:#1a1f25; --ink:#e7eaee; --muted:#9aa4ae; --line:#2d343c;
  --accent:#f5c22c; --accent-ink:#15181c; --accent-soft:#3a3214;
  --ok:#55c78f; --ok-soft:#163327; --warn:#f0a640; --warn-soft:#3a2a12; --bad:#f07068; --bad-soft:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#111418; --chip:#22303f; --chip-ink:#c9d8ea; --s1:#3987e5; --s2:#d95926; --boss:#2a2340; --boss-line:#5b4a8f; --boss-ink:#cdbcff; --air:#182a3e; --air-line:#3f74ad; --air-ink:#9cc8f5; --taxi:#3a3010; --taxi-line:#c99a12; --taxi-ink:#f5d36a; --biz:#7fb0ff; --biz-soft:#16284a; --prem:#f2b066; --prem-soft:#3a2610; --tour:#5fd3a2; --tour-soft:#10342a; --ceo:#4a2c08; --ceo-line:#e8890c; --ceo-ink:#ffc874;
  --bg:#171b20; --surface:#1a1f25; --ink:#e7eaee; --muted:#9aa4ae; --line:#2d343c;
  --accent:#f5c22c; --accent-ink:#15181c; --accent-soft:#3a3214;
  --ok:#55c78f; --ok-soft:#163327; --warn:#f0a640; --warn-soft:#3a2a12; --bad:#f07068; --bad-soft:#3d1c1a; color-scheme:dark}
*{box-sizing:border-box}
/* same width on every tab: always reserve the scrollbar, never scroll sideways */
html{overflow-y:scroll;scrollbar-gutter:stable;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-x:clip;background:var(--page);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;direction:rtl}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
h2{font-size:1.15rem}
h3{font-size:1rem}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:1.1rem}
.roof{background:var(--accent);color:var(--accent-ink);font-size:.7rem;letter-spacing:.08em;padding:2px 8px;border-radius:3px}
.switch{display:flex;gap:4px;margin-inline-start:auto;background:var(--bg);padding:3px;border-radius:8px}
.switch button{border:0;background:transparent;color:inherit;padding:6px 14px;border-radius:6px;cursor:pointer;font-weight:600}
.switch button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.switch #nav-notif{padding:6px 8px;font-size:1rem;line-height:1;opacity:.75}.switch #nav-notif.on{opacity:1;background:transparent}
@media (max-width:600px){.switch{margin-inline-start:0;width:100%;flex-wrap:wrap;justify-content:center}.switch button{padding:6px 10px;font-size:.92rem}}
.wrap{max-width:1100px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.demo{font-size:.85rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px color-mix(in srgb,var(--ink) 4%,transparent);padding:18px;display:grid;gap:14px;min-width:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
label{display:grid;gap:4px;font-size:.85rem;color:var(--muted);font-weight:600}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.btn{text-decoration:none;color:inherit;display:inline-block;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:6px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--bad)}
.btn.small{padding:3px 10px;font-size:.85rem}
.eyebrow{font-size:.75rem;letter-spacing:.06em;color:var(--muted);font-weight:700}
/* quota meter */
.meter{display:grid;gap:8px}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.big{font-family:var(--font-display);font-size:2rem;font-weight:700;line-height:1}
.bar{height:12px;background:var(--bg);border-radius:6px;overflow:hidden;position:relative;border:1px solid var(--line)}
.bar>i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--ok);border-radius:6px}
.bar>i.warn{background:var(--warn)} .bar>i.bad{background:var(--bad)}
.bar>b{position:absolute;inset-block:-2px;inset-inline-start:90%;width:2px;background:var(--muted)}
/* passengers */
.pax{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.pax label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:6px 10px;color:var(--ink);font-weight:400;cursor:pointer}
.pax label.off{opacity:.5;cursor:not-allowed}
.pax input{padding:0}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.t-business{background:var(--biz-soft);color:var(--biz);border:1px solid var(--biz)}
.t-premium{background:var(--prem-soft);color:var(--prem);border:1px solid var(--prem)}
.t-regular,.t-none{background:var(--tour-soft);color:var(--tour);border:1px solid var(--tour)}
.t-day{background:var(--taxi);color:var(--taxi-ink);border:1px solid var(--taxi-line)}
.t-north{background:var(--chip);color:var(--chip-ink)} .t-center{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.kw{font-weight:700;border-radius:4px;padding:0 3px}
.kw-business{color:var(--biz);background:var(--biz-soft)} .kw-premium{color:var(--prem);background:var(--prem-soft)} .kw-regular{color:var(--tour);background:var(--tour-soft)}
/* checks */
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.checks li{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-radius:6px;font-size:.92rem}
.checks .ok{background:var(--ok-soft)} .checks .ok::before{content:"✓";color:var(--ok);font-weight:700}
.checks .appr{background:var(--warn-soft)} .checks .appr::before{content:"⏳"}
.checks .block{background:var(--bad-soft)} .checks .block::before{content:"✕";color:var(--bad);font-weight:700}
.checks .warn{background:var(--warn-soft)} .checks .warn::before{content:"!";color:var(--warn);font-weight:700}
.hint{font-size:.82rem;font-weight:400}
.over{border:2px solid var(--bad);background:var(--bad-soft);border-radius:8px;padding:12px 14px;display:grid;gap:8px}
.over strong{color:var(--bad);font-family:var(--font-display);font-size:1.05rem}
.over label{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:.95rem}
/* rides */
.rides{display:grid;gap:8px}
.day{font-family:var(--font-display);font-weight:700;font-size:.95rem;margin-top:6px;display:flex;gap:8px;align-items:center}
.ride{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
.ride.dim{opacity:.55}
.ride .t{font-family:var(--font-display);font-weight:700;font-size:1.05rem}
.ride .route{font-weight:600}
.ride .who{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;font-size:.88rem;color:var(--muted)}
.ride .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.ride{grid-template-columns:52px minmax(0,1fr)}.ride .acts{grid-column:1/-1;justify-content:flex-start}}
.st{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:4px;white-space:nowrap}
.st-active{background:var(--ok-soft);color:var(--ok)} .st-new{background:var(--accent);color:var(--accent-ink)}
.nbox{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;display:grid;gap:6px;box-shadow:0 1px 0 var(--line)}
.nbox strong{font-family:var(--font-display)}
.nrow{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:8px 10px;border-radius:8px;border-inline-start:4px solid}
.nrow.n-ok{background:var(--ok-soft);border-color:var(--ok)} .nrow.n-ok b:first-child{color:var(--ok)}
.nrow.n-bad{background:var(--bad-soft);border-color:var(--bad)} .nrow.n-bad b:first-child{color:var(--bad)}
.nrow.n-info{background:var(--air);border-color:var(--air-ink)} .nrow.n-info b:first-child{color:var(--air-ink)}
.okbox{border:2px solid var(--ok);background:var(--ok-soft);border-radius:8px;padding:12px 14px;display:grid;gap:8px}
.okbox strong{color:var(--ok);font-family:var(--font-display)}
.okbox .row{justify-content:space-between} .st-pending{background:var(--warn-soft);color:var(--warn)}
.st-cancelled,.st-merged,.st-done{background:var(--bg);color:var(--muted)} .st-late{background:var(--bad-soft);color:var(--bad)}
.note{font-size:.85rem;color:var(--muted)}
.lateconfirm{grid-column:1/-1;background:var(--bad-soft);border-radius:6px;padding:8px 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.9rem}
/* dispatcher */
.cal{display:grid;grid-template-columns:repeat(7,minmax(44px,1fr));gap:4px;min-width:320px}
.cal-h{text-align:center;font-size:.8rem;color:var(--muted);font-weight:700;padding:4px 0}
.cal-d{min-height:64px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:5px 6px;text-align:start}
.cal-d small{font-size:.68rem;line-height:1.2;font-weight:700;overflow-wrap:anywhere;min-width:0;max-width:100%}
.cal-d{min-width:0;overflow:hidden}
@media (max-width:600px){.cal{grid-template-columns:repeat(7,minmax(0,1fr));min-width:0;gap:3px}.cal-d{padding:4px 3px;min-height:56px}.cal-d small{font-size:.56rem;line-height:1.15;font-weight:600}}
.cal-d .cm{display:none}@media (max-width:600px){.cal-d .cf{display:none}.cal-d .cm{display:inline;font-size:.7rem}}
.panel>*{min-width:0;max-width:100%}.winrow input[type=time]{min-width:0}
.st-cancel-ok,.st-late{white-space:normal}.st-cancel-ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.winrow{flex-wrap:wrap}.winrow>span{flex-wrap:wrap}
.cal-d.wk{background:color-mix(in srgb,var(--line) 35%,var(--surface))}
.cal-d.ty-free{background:var(--taxi);border-color:var(--taxi-line);border-width:2px}
.cal-d.ty-free small{color:var(--taxi-ink)}
.cal-d.ty-restricted{background:var(--air);border-color:var(--air-line);color:var(--ink)}
.cal-d.ty-restricted small{color:var(--air-ink)}
.cal-d.today>span{text-decoration:underline;text-underline-offset:3px;font-weight:700}
.cal-d.sel{outline:2px solid var(--ink);outline-offset:1px}
.lg{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--line)}
.lg.ty-free{background:var(--taxi);border-color:var(--taxi-line)}.lg.ty-restricted{background:var(--air);border-color:var(--air-line)}.lg.wk{background:color-mix(in srgb,var(--line) 35%,var(--surface))}
.route-b{display:grid}
.rp{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;position:relative;padding-bottom:16px}
.rp:not(:last-child)::after{content:"";position:absolute;inset-inline-start:15px;top:32px;bottom:2px;width:2px;background:var(--line)}
.rp .dot{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);border:1px solid var(--accent);display:grid;place-items:center;font-weight:700;color:var(--accent-ink)}
.rp.home .dot{background:var(--chip);border-color:var(--chip);color:var(--chip-ink);font-size:1.1rem}
.rp .dot.add{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.rp-body{display:grid;gap:6px;min-width:0}
.rp-body input.city{width:150px}
.pchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;cursor:pointer;font-size:.9rem;color:var(--ink)}
.pchip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.paddr{display:flex;gap:8px;align-items:center;font-weight:400;color:var(--ink);font-size:.88rem}
.paddr span{min-width:80px}.paddr input{flex:1;min-width:0}
.emp-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.edit-row{display:grid;gap:8px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:10px}
.gsteps{margin:0;padding-inline-start:22px;display:grid;gap:6px}
.gsteps li{padding-inline-start:4px;line-height:1.55}
.gsteps li::marker{font-weight:700;color:var(--accent-ink)}
.tip{background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:8px 12px;font-size:.92rem}
.tip.welcome{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.toc{display:flex;gap:6px;flex-wrap:wrap}.toc a{font-size:.85rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px;text-decoration:none}
.toc a:hover{border-color:var(--muted)}
input.bad,select.bad{border-color:var(--warn);background:var(--warn-soft)}
.tabs button.tab-boss{background:var(--boss);color:var(--boss-ink);border:1px solid var(--boss-line);border-bottom-width:3px;border-radius:8px 8px 0 0;margin-inline-start:6px;box-shadow:0 0 0 3px color-mix(in srgb,var(--boss-line) 25%,transparent)}
.tabs button.tab-boss[aria-selected="true"]{border-bottom-color:var(--boss-ink);color:var(--boss-ink)}
.tabs button.tab-ceo{background:var(--ceo);color:var(--ceo-ink);font-weight:700;border:1px solid var(--ceo-line);border-bottom-width:3px;border-radius:8px 8px 0 0;box-shadow:0 0 0 3px color-mix(in srgb,var(--ceo-line) 30%,transparent)}
.tabs button.tab-ceo[aria-selected="true"]{border-bottom-color:var(--ceo-ink);color:var(--ceo-ink)}
.tabs button.tab-ceo:hover{background:color-mix(in srgb,var(--ceo-line) 30%,var(--ceo))}
.tabs button.tab-boss:hover{background:color-mix(in srgb,var(--boss-line) 30%,var(--boss))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.kv{font-family:var(--font-display);font-size:1.5rem;font-weight:700;line-height:1.2}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.chart{margin:0;border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px;min-width:0;background:var(--surface)}
.chart:first-child{grid-column:1/-1}
.chart figcaption{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.chart svg{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.chart .ln{fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round}.chart .area{fill:var(--s1);opacity:.1}
.chart .dot{fill:var(--s1);stroke:var(--surface);stroke-width:2}.chart .hit{fill:transparent;cursor:crosshair}.chart .hit:hover{fill:color-mix(in srgb,var(--s1) 8%,transparent)}
.legend{display:flex;gap:6px;align-items:center;font-size:.82rem;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px}
.legend i.tgt{width:2px;height:12px;background:var(--ink);border-radius:0}
.hbars{display:grid;gap:6px}.hb{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;align-items:center;font-size:.85rem;cursor:default}
.hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ht{position:relative;display:flex;gap:2px;align-items:center;height:18px}
.seg{height:14px;min-width:2px;border-start-end-radius:4px;border-end-end-radius:4px}.seg:has(+ .seg){border-radius:0}
.hv{margin-inline-start:6px;color:var(--muted);font-size:.78rem;white-space:nowrap}
.tgtl{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.6}
.hb:hover .seg{filter:brightness(1.08)}
#tip{position:fixed;z-index:20;background:var(--ink);color:var(--surface);font-size:.82rem;padding:5px 9px;border-radius:6px;pointer-events:none;max-width:260px}
.cal-d.auto{border-style:dashed}
.cal-d.auto.ty-restricted{background:color-mix(in srgb,var(--air) 70%,var(--surface))}
.plancal{display:grid;grid-template-columns:repeat(7,minmax(44px,1fr));gap:4px;min-width:320px}
.pc{min-height:58px;border-radius:6px;padding:4px 6px;display:grid;align-content:space-between;background:var(--surface);border:1px solid var(--line)}
.pc.wk{background:color-mix(in srgb,var(--line) 35%,var(--surface))}
.pc.ty-free{background:var(--taxi);border-color:var(--taxi-line);border-width:2px}
.pc.ty-restricted{background:var(--air);border-color:var(--air-line)}
.pc.auto.ty-restricted{background:color-mix(in srgb,var(--air) 70%,var(--surface))}
.pc.past{opacity:.55} .pc.past.x{background:var(--bg);color:var(--muted);opacity:.6}
.pc .pd{font-size:.72rem;color:var(--muted)}.pc .pr{font-family:var(--font-display);font-size:1.15rem;line-height:1}
.pc small{font-size:.66rem;color:var(--muted)}.pc.ty-free small{color:var(--taxi-ink);font-weight:700}.pc.ty-restricted small{color:var(--air-ink)}
.ride{position:relative;overflow:hidden}

 יותר". לחיצה אחת מסדרת מחדש.',"שלב 3: בוחרים אחראי/ת נסיעה.",'בודקים את "בדיקת ההזמנה" בצד: ירוק תקין, כתום דורש תשומת לב, אדום חוסם. מתקנים ולוחצים "הזמנת מונית".'],tip:"העיר שמופיעה ליד נוסע היא העיר שממנה נסע בפעם האחרונה. שעות האיסוף המשוערות מחושבות לבד."},{h:"⚡ תכנון חכם: הרבה נוסעים, שעה אחת",go:"ops-smart",steps:['בלשונית "⚡ תכנון חכם" בוחרים תאריך ושעה (למשל שעת תחילת העבודה), ומסמנים את הנוסעים. "סימון הכל" מסמן את כולם.',"ליד כל נוסע מופיעה העיר שממנה נסע בפעם האחרונה. אפשר לשנות.",'רוצים גם את החזרה? מסמנים "גם חזרה הביתה בסיום יום העבודה" ובוחרים שעת סיום משותפת. המערכת מתכננת גם את מוניות החזור, ומזמינה הלוך וחזור יחד.','לוחצים "⚡ תכנון המוניות". המערכת מחלקת למספר המוניות הקטן ביותר: נוסעים מאותה עיר או מעיר שעד 10 ק״מ מהמסלול נוסעים יחד, בלי להאריך לאף אחד את הנסיעה ביותר מכ־15 דקות, ובסדר התחנות הקצר ביותר.','המערכת מתחשבת בסוג היום: ביום קרקעי כל מונית נבנית סביב נוסע ביזנס, וביום אווירי תיירים משובצים רק עם ביזנס או פרימיום. נוסע שאין איתו מי שיכול לנסוע, מופיע ב"לא שובצו" עם הסיבה. גם כשאיחוד מאריך למישהו את הנסיעה יותר מדי, המערכת מפצלת למוניות נפרדות.','🚐 ביום קרקעי המערכת לוקחת את שעות המיניבוס של אותו יום מלוח השנה. מיניבוס מתאים להלוך כשהוא מגיע עד שעה לפני השעה שבחרתם או עד חצי שעה אחריה, ולחזור כשהוא יוצא עד חצי שעה לפני או עד שעה אחרי. משובצים בו רק מי שגרים בתל אביב והסביבה הצמודה (עד 5 ק״מ מתחנות תל אביב, דניאל פריש והשלום) או עד 10 ק״מ מבסיס חצור. תיירים קודם. פרימיום וביזנס עוברים למיניבוס רק כשזה חוסך מונית. "במונית" מחזיר נוסע למונית, ו"וואטסאפ" שולח לו את התחנה והשעה. אפשר לכבות בתיבה "לשבץ במיניבוס".',"בכל מונית בודקים את הכתובות בתחנות ומשלימים מה שחסר. נסיעה שמתחילה לפני 05:00 צריכה פירוט לנסיעת לילה.",'"הזמנת כל המוניות התקינות" מזמין הכל בלחיצה. מונית שצריכה תיקון אפשר לפתוח ב"עריכה בטופס".']},{h:"מה קורה אחרי ששולחים",steps:["נסיעה רגילה עוברת ישר לסדרן.",'נסיעה שצריכה החרגה מחכה קודם לאישור: נוסע בודד ← הבוס הגדול. נסיעת לילה (23:00–05:00) ← המנכ״ל. 4 נוסעים ← מסמנים בעצמכם "המבצעים מאשרים" לפני השליחה.','הסדרן מזמין את המונית ומאשר. בראש העמוד קופצת התראה 🔔 "המונית הוזמנה".',"כשמגיעים פרטי הנהג תקבלו את השם והטלפון שלו.",'"הבנתי" מסתיר התראה שכבר ראיתם.']},{h:"📱 שליחת פרטי הנסיעה לנוסעים",go:"ops",steps:['כשמגיעים פרטי הנהג, בהתראה למעלה מופיע "📱 שליחה לנוסעים". אפשר גם לפתוח "פרטים" ליד הנסיעה.','ב"הודעה לנוסעים" לוחצים ליד כל נוסע "וואטסאפ" או "SMS".','ההודעה נפתחת מוכנה בטלפון שלכם: שעה, מסלול, מאיפה נאסף, פרטי הנהג, האחראי/ת וקישור קצר להוספה ליומן. לוחצים "שליחה".',"ליד מי שקיבל מופיע ✓ נשלח, ולמעלה כמה נשלחו מתוך כמה."],tip:'נוסע בלי טלפון במאגר לא יופיע ברשימה. עדכנו לו טלפון בלשונית "נוסעים".'},{h:"שינוי הזמנה",go:"ops",steps:['ב"ההזמנות שלי" לוחצים "שינוי" ליד הנסיעה. ההזמנה נטענת לטופס.',"אפשר: להזיז את השעה עד שעה, להוסיף, להסיר או להחליף נוסע אחד, ולעדכן תחנות וכתובות. התאריך והכיוון לא משתנים.",'לוחצים "שמירת השינוי". גם הזמנה שכבר אושרה חוזרת לסדרן לאישור מחדש. אם השינוי יוצר החרגה חדשה (למשל נוסע בודד), היא תחכה קודם לאישור.',"אפשר לשנות עד 3 שעות לפני הנסיעה. שינוי גדול יותר: מבטלים ומזמינים מחדש."]},{h:"ביטול הזמנה",go:"ops",steps:['ב"ההזמנות שלי" לוחצים "ביטול" ליד הנסיעה.',"מותר לבטל: עד 22:00 בערב שלפני הנסיעה (סגירת יישור הקו), וגם אז לפחות 3 שעות לפני שהמונית יוצאת. גם אחרי שהסדרן אישר. לא נספר בסל ואין קנס.","אחרי 22:00 בערב שלפני: הביטול בניגוד לנהלים ונספר כאילו המונית יצאה, אבל אין קנס.","ביטול מאוחר: פחות מ־3 שעות לפני היציאה. נספר בסל, והמערכת תבקש אישור לפני כן.","קנס: ביטול מאוחר של מונית שהסדרן כבר הזמין הוא גם קנס של 1,000 ₪ שהמבצעים חייבים למנכ״ל.","ליד כל ביטול כתוב מי ביטל."]},{h:"🔒 אבטחת מידע",go:"ops",steps:["כמעט כל נסיעה צריכה אישור אבטחת מידע. זה מעקב פנימי שלכם.",'אם האישור כבר התקבל, מסמנים "כבר התקבל אישור אבטחת מידע" לפני השליחה.','אחר כך, ב"ההזמנות שלי", לחיצה על 🔒 מחליפה בין: ממתין ← אושר ← לא נדרש.',"בראש העמוד מופיעה תזכורת לנסיעות קרובות בלי אישור."]},{h:"נוסעים: הוספה, עריכה והסרה",go:"ops-pax",steps:['בלשונית "נוסעים" ← "הוספת נוסע": שם, סוג (ביזנס, פרימיום או תיירים) וטלפון נייד. בלי טלפון הנוסע לא יקבל הודעה עם פרטי הנסיעה.','שומרים על פרטיות: רק שם פרטי ואות ראשונה של שם המשפחה, למשל "דנה כ.". כתבתם שם מלא? הוא יקוצר לבד. אם כבר יש "דנה כ." במאגר, נשמרת אות נוספת ("דנה כה.").','"הוספה למאגר". הנוסע מופיע בהזמנות מיד. המנהלת והנסיכות רואות כל נוסע חדש ויכולות לתקן פרטים.','עריכה: "עריכה" ליד הנוסע ← משנים ← "שמירה". השינוי בתוקף מיד.','הסרה: "הסרה" ← אישור. הנוסע יורד מיד.']},{h:"מי פנוי באלנבי: חיסכון במוניות",go:"ops-merge",steps:["כאן מופיעות הצעות לאחד הזמנה שלכם עם הזמנה קרובה של מבצעים אחרים.","רואים את המסלול המאוחד, השעות, כמה זמן מתווסף וכמה מונית תרד לכם מהסל.",'"מאשרים איחוד" או "לא מאשרים". האיחוד קורה רק אם כל המבצעים אישרו.']},{h:"תכנון חודשי",go:"ops-plan",steps:["לוח השנה זהה ללוח של המנהלת: צהוב יום מוניות, כחול יום אווירי עם שעות הטיסות, ירוק יום קרקעי עם שעות המיניבוסים. ימים שעברו מופיעים בהיר.","מתכננים מוניות בעיקר בימי מוניות. בימים אוויריים וקרקעיים יש מענה חלופי (טיסה או מיניבוס), ולכן משאירים רק רזרבה קטנה לחריגים.",'רושמים בכל יום כמה מוניות מתכננים, או לוחצים "⚡ תכנון אוטומטי" ומתקנים.',"בתחתית: פיזור מומלץ, קצב החודש וטיפים לחיסכון.",'הזמנה ביום שלא תכננתם בו, או מעבר למספר שתכננתם, מקבלת התראה כתומה "📅 מחוץ לתכנון" בבדיקת ההזמנה. אפשר להזמין, וההזמנה מסומנת כך גם אצל המנהלת בהיסטוריה.']},{h:"הסל החודשי",steps:["בראש העמוד: כמה מוניות נוצלו ומה נשאר.","מונית משותפת עם מבצעים אחרים נספרת לפי מספר הנוסעים שלכם, למשל ⅓ מונית.","מותר לחרוג, אבל החריגה יורדת מהסל של החודש הבא. לפני השליחה תופיע אזהרה שצריך לאשר."]}],rules:!0},boss:{title:"בוס גדול",intro:"הבוס הגדול מאשר נסיעות עם נוסע בודד ושומר שהן לא יעברו 25% מהנסיעות.",quick:['נכנסים כ"בוס גדול" של המבצעים שלכם.','לשונית "בוס גדול" (הסגולה): "אישור" או "דחייה" לכל נסיעה עם נוסע בודד.',"שמים לב לאחוז הנוסע הבודד בראש העמוד: היעד הוא עד 25%."],sections:[{h:"כניסה",go:"ops-boss",steps:[PROD?'במסך הכניסה בוחרים "בוס גדול" ואת המבצעים שלכם, ומקלידים את הסיסמה שקיבלתם מהמנהלת.':'בעמוד "מבצעים" עוברים ללשונית "בוס גדול". הסיסמה היא הטלפון הנייד של הבוס הגדול.','עוברים ללשונית "בוס גדול". שאר העמוד זהה לעמוד המבצעים, כך שאפשר גם להזמין.']},{h:"אישור נסיעות",go:"ops-boss",steps:["ברשימה מופיעות נסיעות עם נוסע בודד שמחכות לך.","ליד כל נסיעה כתוב לאיזה אחוז נוסע בודד האישור יעלה.",'"אישור" מעביר את הנסיעה לסדרן (או למנכ״ל, אם זו גם נסיעת לילה). "דחייה" מבטלת אותה, והמבצעים מקבלים התראה.',"נסיעות לילה מאשר המנכ״ל, אלא אם הוא האציל לך את הסמכות."]}]},disp:{title:"סדרן",intro:"הסדרן מזמין את המוניות בפועל, מעדכן פרטי נהג ושולח לחברת המוניות את הקו של מחר.",quick:['נכנסים כ"סדרן" ומשאירים את ההתראה הקולית פעילה.','"לוח הזמנות": הזמנה חדשה ← מזמינים מונית ← "אישור הזמנה".','מגיעים פרטי נהג ← ממלאים בשורה של הנסיעה ← "שמירה ושליחה למבצעים".','כל ערב (בערך 23:00): "יישור קו" ← "יישור קו וסגירה" ← שליחה לחברת המוניות.',"⚡ מתפרצת = הזמנה שנכנסה אחרי סגירת הקו. מטפלים מיד."],sections:[{h:"כניסה",go:"disp",steps:[LOGIN("סדרן",'"סדרן"'),"כפתור 🔔 בראש הלוח מפעיל או משתיק צליל על כל הזמנה חדשה."]},{h:"🔔 התראות למכשיר",steps:["בסרגל העליון לוחצים על הפעמון 🔕 ומאשרים בחלון שקופץ. כשההתראות פעילות הוא מתחלף ל־🔔.","מעכשיו כל דבר שמחכה לפעולה שלכם מקפיץ התראה בטלפון או במחשב, גם כשהאפליקציה ברקע.","האפליקציה צריכה להישאר פתוחה (אפשר ברקע). באייפון: קודם מוסיפים את האתר למסך הבית ופותחים משם."]},{h:"אישור הזמנה חדשה",go:"disp",steps:['בלשונית "לוח הזמנות" ההתראות מחולקות: לפעולה (צריך לטפל) ולידיעה (סטטוס של המבצעים).','הזמנה חדשה מסומנת "חדשה · ממתינה לסדרן". הזמנה שהמבצעים שינו מסומנת "✏️ שונתה · ממתינה לאישור מחדש", עם מה שהשתנה. מאשרים אותה שוב.','מזמינים מונית מחברת המוניות ולוחצים "אישור הזמנה". המבצעים מקבלים התראה.','"🚕 סיכום לנהג" פותח את פרטי הנסיעה והכתובות להעתקה.',"אם יש סדר תחנות קצר יותר, מופיעה הצעה לסדר מחדש."]},{h:"פרטי נהג",go:"disp",steps:['ישר בשורה של הנסיעה, ליד "🚕 נהג", ממלאים שם וטלפון ולוחצים "שמירה ושליחה למבצעים" (או Enter). אפשר גם לפני האישור.',"המבצעים מקבלים את הפרטים מיד, והם שולחים לנוסעים את ההודעה.",'ב"📱 הודעה לנוסעים" רואים למי כבר נשלח (✓) ולמי עוד לא.']},{h:"ממתין להחרגה",go:"disp-approvals",steps:["כאן רואים נסיעות שמחכות לבוס הגדול או למנכ״ל. זה למעקב בלבד, הסדרן לא מאשר כאן.",'אחרי האישור הנסיעה מגיעה ל"לוח הזמנות".']},{h:"יישור קו לילי",go:"disp-line",steps:['בלשונית "יישור קו" מופיעות כל הנסיעות של מחר לפי שעות, עם כתובות, נוסעים וטלפונים.',"אם יש הזמנות שעוד לא אושרו, תופיע אזהרה. מאשרים אותן קודם.",'"יישור קו וסגירה".','שולחים לחברת המוניות: "העתקה כטקסט" לוואטסאפ או למייל, "העתקה לאקסל" או "הורדת קובץ".',"הזמנה שנכנסת אחרי הסגירה מסומנת ⚡ ומשמיעה צליל כפול."]},{h:"הגדרות",go:"disp-settings",steps:["ערים מותרות: מוסיפים עיר ומסמנים צפון או מרכז.","מחירי מונית, ופרטי הנוסעים (סוג וטלפון).","זמני הנסיעה מחושבים לבד לפי המרחק ושעת היום."]}]},adm:{title:"המנהלת",intro:"המנהלת רואה את כל האפליקציה: לוח השנה, אישורים, סלים, הוצאות והיסטוריה, וגם את העמודים של המבצעים והסדרן.",quick:[PROD?'נכנסים ב"כניסת המנהלת (במייל)".':'נכנסים: "המנהלת" ← סיסמה.','"לוח שנה": מסמנים ימי מוניות, אוויריים וקרקעיים. כולם רואים אותו בתכנון החודשי.','"ממתין להחרגה" ו"אישור נוסעים": מה שמחכה להחלטה.','"מעקב והוצאות": גרפים, חריגות מהסל והיסטוריית מוניות להורדה.',PROD?'"סיסמאות": סיסמה לכל תפקיד. כדי לחסום מישהו מחליפים לו סיסמה.':'"סלים": סל חודשי וסיסמה לכל אחד מהמבצעים.'],sections:[{h:"כניסה וסיסמאות",go:PROD?"adm-users":"adm",steps:PROD?['במסך הכניסה לוחצים "כניסת המנהלת (במייל)" ונכנסים עם המייל והסיסמה שלך. רק לך יש כניסה במייל.','בלשונית "סיסמאות" קובעים סיסמה לכל תפקיד: כל אחד מהמבצעים, כל בוס גדול, נסיכות, סדרן ומנכ״ל (לפחות 6 תווים).',"כדי לחסום מישהו, מחליפים לו את הסיסמה."]:['לוחצים למעלה על "המנהלת" ומקלידים את הסיסמה.']},{h:"🔔 התראות למכשיר",steps:["בסרגל העליון לוחצים על הפעמון 🔕 ומאשרים בחלון שקופץ. כשההתראות פעילות הוא מתחלף ל־🔔.","מעכשיו כל דבר שמחכה לפעולה שלכם מקפיץ התראה בטלפון או במחשב, גם כשהאפליקציה ברקע.","האפליקציה צריכה להישאר פתוחה (אפשר ברקע). באייפון: קודם מוסיפים את האתר למסך הבית ופותחים משם."]},{h:"לוח שנה וסוגי ימים",go:"adm-calendar",steps:["ראשון–חמישי מסומנים אוטומטית כיום אווירי, שישי–שבת כיום קרקעי. לוחצים על יום כדי לשנות, למשל ליום מוניות.","יום אווירי: הטיסות הקבועות (הגעה 08:25, יציאה 18:00, ובשעון חורף 17:30) ממולאות לבד. אפשר לשנות כל שעה.","יום קרקעי: המיניבוס הקבוע (09:00) ממולא לבד.","45 דקות לפני ואחרי כל טיסה או מיניבוס אי אפשר להזמין מונית.",'את השעות הקבועות משנים ב"שעות קבועות". שינוי ביום מסוים משפיע רק עליו.','בכל יום אפשר להוסיף בלוח השנה מיניבוסים או טיסות תובלה ("תוספות ליום הזה"): בשעות הקבועות בלחיצה, או שעה משלכם. לכל אחד בוחרים כיוון: הגעה לבסיס, יציאה מהבסיס או שניהם. כלל 45 הדקות חל לפי הכיוון: מיניבוס הגעה ב־09:00 חוסם מוניות שמגיעות לבסיס בין 08:15 ל־09:45, אבל לא מוניות שיוצאות. ביום מוניות התוספות לא חוסמות בכלל. לכל מיניבוס בוחרים גם קו: תל אביב, חצור או כל הקווים. אפשר כמה מיניבוסים באותה שעה (אחד לכל קו). מיניבוס של קו חוסם רק מוניות שאוספות או מורידות באזור שלו, והתכנון החכם משבץ בו רק את מי שגר ליד התחנות של אותו קו. הזכאות לפי סוג היום, בלי שינוי. בתכנון החכם המערכת תציע לגרים ליד תחנה בתל אביב (או ליד בסיס חצור) לעלות עליהם במקום מונית.']},{h:"ממתין להחרגה",go:"adm-approvals",steps:["כל הנסיעות שמחכות לבוס גדול (נוסע בודד) או למנכ״ל (נסיעת לילה), מחולקות לשתי רשימות.",'זה למעקב. הבוס הגדול מאשר אצלו, ונסיעות לילה מאשרים בלשונית "★ מנכ״ל".']},{h:"נוסעים חדשים",go:"adm-paxreq",steps:["המבצעים והנסיכות מוסיפים, עורכים ומסירים נוסעים בעצמם, בלי אישור.",'בלשונית "נוסעים חדשים" רואים כל נוסע שנוסף או שונה ב־30 הימים האחרונים: מי הוסיף ומתי.','מצאת טעות? "עריכה" ← מתקנים ← "שמירה", או "הסרה".']},{h:"סלים",go:"adm-quotas",steps:[PROD?"לכל אחד מהמבצעים קובעים שם, לוגו, צבע וסל חודשי.":"לכל אחד מהמבצעים קובעים שם, לוגו, צבע, סיסמה, טלפון בוס גדול וסל חודשי.","רואים כמה כל אחד ניצל. מעל 90% מופיעה התראה.",'בעמודה "המבצעים רואים את הסל" אפשר להסתיר את הסל ממבצעים מסוימים (כרגע מגדל ויבא). הם לא יראו כמה מוניות יש להם ומה נשאר, ויתכננו ויזמינו כרגיל.']},{h:"מעקב, היסטוריה ותחקיר",go:"adm-costs",steps:["בוחרים חודש ורואים לכל המבצעים: מוניות, צפון ומרכז, נוסע בודד וההוצאה. חריגות מהסל מופיעות בבירור למעלה.",'בתחתית, "היסטוריית מוניות": לכל נסיעה מתי הוזמנה, לאיזה מועד, מי הזמין, מי נסע, אם נדרשה החרגה ואיזו, הסטטוס והנהג.','"הורדה לאקסל" מוריד את החודש כקובץ.','"קנסות ביטול": ביטול מאוחר (פחות מ־3 שעות לפני היציאה) של מונית שהסדרן כבר הזמין הוא קנס של 1,000 ₪. ביטול עד 3 שעות לפני אינו קנס, גם אחרי האישור. רואים סכום לכל אחד מהמבצעים, מה פתוח, ומסמנים "שולם".','ליד נסיעה שכבר יצאה, "📝 הוספת תחקיר" שומר הערות לשימור. הן נכנסות גם לקובץ.']},{h:"★ מנכ״ל: נסיעות לילה",go:"adm-ceo",steps:["נסיעה בין 23:00 ל־05:00 צריכה אישור מנכ״ל.",PROD?'בלשונית "★ מנכ״ל" לוחצים "אישור" או "דחייה". אחרי האישור (ושל הבוס הגדול, אם נדרש) ההזמנה עוברת לסדרן.':'בלשונית "★ מנכ״ל" (בנתוני הדוגמה הסיסמה 9999) לוחצים "אישור" או "דחייה".',"האצלת סמכות: אפשר לתת לבוס הגדול של מבצעים מסוימים לאשר נסיעות לילה בעצמו, לתמיד או עד תאריך, ולבטל בכל רגע."]},{h:"מי מחובר עכשיו",steps:["בשורה שמתחת לסרגל העליון, בכל העמודים, רואים מי האפליקציה פתוחה אצלו ברגע זה, עם הסמל של המבצעים שלו.","השורה מתעדכנת לבד. רק המנהלת רואה אותה."]},{h:"צפייה בעמודים אחרים",steps:['בתפריט למעלה עוברים ל"מבצעים" או ל"עמוד סדרן".','כמנהלת נכנסים לכל אחד מהמבצעים בלי סיסמה, ורואים בדיוק מה שהם רואים. "החלפת מבצעים" עובר לאחרים.']},{h:"איפוס נתונים",go:"adm-quotas",steps:['בתחתית לשונית "סלים". "מחיקת הזמנות" מוחק את כל ההזמנות וההיסטוריה ומשאיר את הנוסעים. "איפוס מלא" מוחק גם את הנוסעים ובקשות הנוסעים.',"נשארים: המבצעים והסלים, לוח השנה, ההגדרות והסיסמאות.",'אי אפשר לבטל. מורידים קודם את ההיסטוריה לאקסל, מקלידים "איפוס" ולוחצים על הכפתור. רק המנהלת רואה אותו.']}]},princess:{title:"★ נסיכות",intro:"הנסיכות מזמינה מוניות לכל הנוסעים מכל המבצעים, ויש לה את עמוד המנהלת חוץ מאישורי מנכ״ל, סיסמאות ואיפוס נתונים. היא לא נכנסת לעמודים של מבצעים אחרים.",quick:['נכנסים כ"נסיכות". נפתח ישר עמוד ההזמנות של הנסיכות.','"ממתין להחרגה": מאשרים או דוחים נסיעות של יבא עם נוסע בודד.','לוח שנה, ממתין להחרגה, אישור נוסעים, סלים ומעקב: בדיוק כמו אצל המנהלת. ההוראות בלשונית "המנהלת".',"מזמינים כרגיל, לכל נוסע מכל המבצעים. לעמוד המנהלת עוברים בתפריט למעלה."],sections:[{h:"כניסה",go:"ops",steps:[LOGIN("מבצעים",'"★ נסיכות"'),'נפתח עמוד ההזמנות של הנסיכות. בתפריט למעלה יש גם "המנהלת", ו"עמוד סדרן"
